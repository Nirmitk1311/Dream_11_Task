[theme]
base = "light"
primaryColor = "#C2410C"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#EAE5DA"
textColor = "#17171B"
borderColor = "#D8D2C4"
linkColor = "#C2410C"
greenColor = "#1F7A4D"
redColor = "#B42318"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap, sans-serif"
headingFont = "Barlow Condensed:https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseRadius = "3px"
buttonRadius = "3px"
showWidgetBorder = true
showSidebarBorder = false
baseFontSize = 17

[theme.sidebar]
backgroundColor = "#1B1B20"
secondaryBackgroundColor = "#26262C"
textColor = "#EDE9E0"
borderColor = "#34343B"
primaryColor = "#F97316"

[client]
toolbarMode = "minimal"
